<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vote en direct — POD Odyssey (vue présentateur)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@8.10.1/firebase-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@8.10.1/firebase-database.js"></script>
<style>
  :root {
    --pod-purple: #c8b5e8;
    --pod-pink: #f2a8bc;
    --pod-green: #a8c4b8;
    --pod-orange: #f5926a;
    --pod-yellow: #e8c96a;
    --pod-blue: #bdd1ff;
    --pod-ink: #002060;
    --pod-bg: #fbfbfd;
    --pod-surface: #ffffff;
    --line: rgb(0 32 96 / 10%);
    --line-soft: rgb(0 32 96 / 6%);
    --muted: rgb(0 32 96 / 52%);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--pod-bg);
    color: var(--pod-ink);
    font-family: Inter, Avenir, 'Segoe UI', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, p { margin: 0; text-wrap: balance; }

  .tabular { font-variant-numeric: tabular-nums; }

  [hidden] { display: none !important; }

  .status-banner {
    display: none;
    align-items: center;
    gap: 0.6em;
    margin: 0 0 20px;
    padding: 12px 16px;
    border: 1px solid rgb(245 146 106 / 35%);
    border-radius: 12px;
    background: rgb(245 146 106 / 10%);
    color: var(--pod-ink);
    font-size: 0.92rem;
    font-weight: 600;
  }

  .status-banner.is-visible { display: flex; }

  .stage {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
    gap: 40px;
    max-width: 1180px;
    margin: 0 auto;
    padding: 44px 32px 56px;
  }

  #presenterBanner { grid-column: 1 / -1; }

  .polls-column {
    display: flex;
    flex-direction: column;
    gap: 40px;
    min-width: 0;
  }

  .poll-block-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 18px;
  }

  .eyebrow {
    display: block;
    margin: 0 0 6px;
    color: var(--pod-orange);
    font-size: 0.8rem;
    font-weight: 800;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }

  .poll-block-header h1 {
    color: var(--pod-ink);
    font-size: clamp(1.3rem, 2vw, 1.9rem);
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .poll-block-header p {
    margin-top: 6px;
    max-width: 46ch;
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.45;
  }

  .live-count {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }

  .live-count .n {
    color: var(--pod-ink);
    font-size: 2rem;
    font-weight: 800;
    line-height: 1;
  }

  .live-count .lbl {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--pod-green);
    box-shadow: 0 0 0 4px rgb(168 196 184 / 30%);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  .results {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .tier {
    display: grid;
    grid-template-columns: 168px 1fr;
    align-items: center;
    gap: 22px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line-soft);
  }

  .tier:last-child { border-bottom: none; }

  .tier-block {
    justify-self: end;
    height: 46px;
    border-radius: 10px;
    background: var(--tier-color);
    box-shadow: inset 0 -10px 16px rgb(0 0 0 / 10%);
  }

  .tier-labels {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }

  .tier-labels > span:first-child {
    min-width: 0;
    flex: 1 1 auto;
  }

  .tier-name {
    color: var(--pod-ink);
    font-size: 0.98rem;
    font-weight: 750;
  }

  .tier-sub {
    display: block;
    margin-top: 1px;
    color: var(--muted);
    font-size: 0.76rem;
    font-weight: 500;
  }

  .tier-figure {
    display: flex;
    flex: none;
    align-items: baseline;
    gap: 6px;
    white-space: nowrap;
    color: var(--pod-ink);
    font-weight: 800;
    font-size: 0.98rem;
  }

  .tier-figure .votes {
    color: var(--muted);
    font-size: 0.76rem;
    font-weight: 600;
  }

  .meter {
    position: relative;
    height: 10px;
    border-radius: 999px;
    background: var(--line-soft);
    overflow: hidden;
  }

  .meter-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: var(--tier-color);
    transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .poll-reset {
    margin-top: 14px;
  }

  /* -- QR / join panel : deux cartes, une par vote -- */
  .join-card {
    align-self: start;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .join-tile {
    padding: 22px 20px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--pod-surface);
    box-shadow: 0 18px 40px rgb(0 32 96 / 8%);
    text-align: center;
  }

  .join-tile h2 {
    color: var(--pod-ink);
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .join-tile > p {
    margin-top: 6px;
    color: var(--muted);
    font-size: 0.86rem;
    line-height: 1.4;
  }

  .qr-frame {
    display: grid;
    place-items: center;
    width: 168px;
    height: 168px;
    margin: 18px auto 12px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: #fff;
  }

  .qr-frame img, .qr-frame canvas, .qr-frame table { border-radius: 4px; }

  .qr-fallback {
    color: var(--muted);
    font-size: 0.8rem;
    line-height: 1.4;
  }

  .join-url {
    display: block;
    margin-top: 4px;
    padding: 9px 11px;
    border-radius: 10px;
    background: rgb(200 181 232 / 16%);
    color: var(--pod-ink);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    word-break: break-all;
  }

  .reset-btn {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
  }

  .reset-btn:hover { border-color: var(--pod-orange); color: var(--pod-orange); }

  .org-note {
    margin-top: 4px;
    color: var(--muted);
    font-size: 0.72rem;
    line-height: 1.45;
    text-align: center;
  }

  @media (max-width: 860px) {
    .stage { grid-template-columns: 1fr; padding: 28px 18px 40px; }
    .poll-block-header { flex-direction: column; align-items: flex-start; }
    .live-count { align-items: flex-start; }
    .tier { grid-template-columns: 92px 1fr; gap: 14px; }
    .tier-block { height: 34px; }
    .join-card { order: -1; }
  }
</style>
</head>
<body>

<div id="presenter" class="stage">
  <div id="presenterBanner" class="status-banner"></div>

  <div class="polls-column" id="pollsColumn"></div>

  <aside class="join-card" id="joinCard"></aside>
</div>

<script src="./vote-common.js"></script>
<script>
(function () {
  'use strict';

  // Two independent live votes, each its own Firebase collection, each its own
  // standalone voter page (and QR code) so scanning one never shows the other
  // poll's options — order here just follows the deck's own order.
  var POLLS = [
    {
      key: 'pyramid',
      dbPath: 'votes',
      eyebrow: 'POD Odyssey — Les outils IA',
      presenterTitle: 'La pyramide, votée en direct',
      presenterSub: 'Scannez le QR code pour indiquer les initiatives déjà en place ou en cours dans votre entreprise. Le résultat se met à jour ici en temps réel.',
      participantsLabel: 'participants',
      pageUrl: 'https://maudgub.github.io/pod-odyssey-interact/vote-pyramid.html',
      // Widths mirror the real pyramid's proportions (floor 1 = base = 100).
      options: [
        { id: '0', label: 'Assistance Ad hoc', sub: 'AI Chat & agents', color: '#D9AB16', width: 100 },
        { id: '1', label: 'Vibe coding', sub: 'Développement de produits avec l’IA', color: '#1F648F', width: 79 },
        { id: '2', label: 'Agentique', sub: 'Automatisation de process métier', color: '#AA2078', width: 60 },
        { id: '3', label: 'Talk to your Data', sub: 'Décisionnel & analytique via l’IA', color: '#2C9D62', width: 38 },
        { id: '4', label: 'Product Build', sub: 'Création de prototypes avec l’IA', color: '#EC7C32', width: 18 }
      ]
    },
    {
      key: 'personae',
      dbPath: 'personaVotes',
      eyebrow: 'POD Odyssey — Vos équipes',
      presenterTitle: 'Les profils de vos équipes, en direct',
      presenterSub: 'Scannez le QR code pour indiquer les profils que vous reconnaissez déjà dans vos équipes. Le résultat se met à jour ici en temps réel.',
      participantsLabel: 'participants',
      pageUrl: 'https://maudgub.github.io/pod-odyssey-interact/vote-personae.html',
      options: [
        { id: 'newbie', label: 'Le réticent', sub: '« Jamais essayé »', color: '#A8C4B8', width: 100 },
        { id: 'explorateur', label: 'L’illusionné', sub: '« J’utilise en perso »', color: '#E8C96A', width: 100 },
        { id: 'batisseur', label: 'Le frustré', sub: '« J’ai essayé »', color: '#F5926A', width: 100 },
        { id: 'champion', label: 'Le shadow builder', sub: '« J’utilise à fond »', color: '#C8B5E8', width: 100 }
      ]
    }
  ];

  function buildPresenterPoll(poll) {
    var column = document.getElementById('pollsColumn');
    var section = document.createElement('section');
    section.innerHTML =
      '<div class="poll-block-header">' +
        '<div>' +
          '<span class="eyebrow">' + poll.eyebrow + '</span>' +
          '<h1>' + poll.presenterTitle + '</h1>' +
          '<p>' + poll.presenterSub + '</p>' +
        '</div>' +
        '<div class="live-count">' +
          '<span class="n tabular" id="total-' + poll.key + '">0</span>' +
          '<span class="lbl"><span class="live-dot"></span>' + poll.participantsLabel + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="results" id="results-' + poll.key + '"></div>' +
      '<div class="poll-reset">' +
        '<button type="button" class="reset-btn" id="reset-' + poll.key + '">Réinitialiser ce vote</button>' +
      '</div>';
    column.appendChild(section);

    var results = document.getElementById('results-' + poll.key);
    poll.options.slice().reverse().forEach(function (o) {
      var row = document.createElement('div');
      row.className = 'tier';
      row.style.setProperty('--tier-color', o.color);
      row.innerHTML =
        '<div class="tier-block" style="width:' + o.width + '%"></div>' +
        '<div>' +
          '<div class="tier-labels">' +
            '<span><span class="tier-name">' + o.label + '</span><span class="tier-sub">' + o.sub + '</span></span>' +
            '<span class="tier-figure"><span class="pct tabular" data-opt="' + poll.key + ':' + o.id + '">0%</span><span class="votes tabular" data-opt-n="' + poll.key + ':' + o.id + '">0 vote</span></span>' +
          '</div>' +
          '<div class="meter"><div class="meter-fill" data-opt-bar="' + poll.key + ':' + o.id + '"></div></div>' +
        '</div>';
      results.appendChild(row);
    });
  }

  function buildJoinTile(poll) {
    var card = document.getElementById('joinCard');
    var tile = document.createElement('div');
    tile.className = 'join-tile';
    tile.innerHTML =
      '<h2>' + poll.eyebrow + '</h2>' +
      '<p>Scannez ce code — aucune app à installer.</p>' +
      '<div class="qr-frame" id="qrFrame-' + poll.key + '"></div>' +
      '<code class="join-url">' + poll.pageUrl.replace('https://', '') + '</code>';
    card.appendChild(tile);
    PodVote.renderQR('qrFrame-' + poll.key, poll.pageUrl);
  }

  function applyTally(poll, counts, total) {
    var totalEl = document.getElementById('total-' + poll.key);
    if (totalEl) totalEl.textContent = total;
    poll.options.forEach(function (o) {
      var n = counts[o.id] || 0;
      var pct = total > 0 ? Math.round((n / total) * 100) : 0;
      var key = poll.key + ':' + o.id;
      var pctEl = document.querySelector('[data-opt="' + key + '"]');
      var nEl = document.querySelector('[data-opt-n="' + key + '"]');
      var barEl = document.querySelector('[data-opt-bar="' + key + '"]');
      if (pctEl) pctEl.textContent = pct + '%';
      if (nEl) nEl.textContent = n + (n === 1 ? ' vote' : ' votes');
      if (barEl) barEl.style.width = pct + '%';
    });
  }

  function wirePresenterPoll(poll, root) {
    var pollRef = root.child(poll.dbPath);
    pollRef.on('value', function (snap) {
      var counts = {};
      var total = 0;
      snap.forEach(function (child) {
        var d = child.val();
        var picks = null;
        if (d && d.floors && typeof d.floors === 'object') {
          picks = Object.keys(d.floors).filter(function (k) { return d.floors[k]; });
        } else if (d && d.floor !== undefined && d.floor !== null) {
          picks = [String(d.floor)];
        }
        if (picks && picks.length) {
          total++;
          picks.forEach(function (id) {
            counts[id] = (counts[id] || 0) + 1;
          });
        }
      });
      applyTally(poll, counts, total);
    }, function () {
      PodVote.showBanner('presenterBanner', 'Connexion au vote en direct interrompue.');
    });

    var resetBtn = document.getElementById('reset-' + poll.key);
    if (resetBtn) {
      resetBtn.addEventListener('click', function () {
        pollRef.remove().catch(function () {});
      });
    }
  }

  function main() {
    POLLS.forEach(buildPresenterPoll);
    POLLS.forEach(buildJoinTile);

    if (typeof firebase === 'undefined' || !firebase.database) {
      PodVote.showBanner('presenterBanner', 'Le service de vote n’a pas pu se charger — vérifiez votre connexion et rechargez la page.');
      return;
    }

    firebase.initializeApp(PodVote.FIREBASE_CONFIG);
    var root = firebase.database().ref();
    POLLS.forEach(function (poll) { wirePresenterPoll(poll, root); });
  }

  main();
})();
</script>
</body>
</html>
